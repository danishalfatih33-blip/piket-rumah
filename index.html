<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piket Rumah Ceria Pro - Absensi & Monitoring</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @keyframes goldGlow {
      0%, 100% { box-shadow: 0 0 20px rgba(245, 158, 11, 0.6), 0 0 40px rgba(245, 158, 11, 0.2); }
      50% { box-shadow: 0 0 35px rgba(245, 158, 11, 0.9), 0 0 60px rgba(245, 158, 11, 0.4); }
    }
    .best-piker-card {
      animation: goldGlow 2.5s infinite ease-in-out;
      border-color: #f59e0b !important;
    }
    @keyframes floatCrown {
      0%, 100% { transform: translateY(0px) rotate(-3deg); }
      50% { transform: translateY(-6px) rotate(3deg); }
    }
    .crown-float {
      animation: floatCrown 3s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen pb-16 selection:bg-amber-500 selection:text-slate-950">

  <!-- Audio Sound Effects -->
  <audio id="snd-success" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3" preload="auto"></audio>
  <audio id="snd-click" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3" preload="auto"></audio>
  <audio id="snd-fanfare" src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3" preload="auto"></audio>

  <!-- Header & Switcher Mode -->
  <header class="bg-slate-900/80 backdrop-blur-xl border-b border-slate-800/80 sticky top-0 z-40">
    <div class="max-w-md mx-auto p-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-amber-500 via-amber-400 to-yellow-300 flex items-center justify-center text-slate-950 shadow-lg shadow-amber-500/20 font-black">
          <i class="fa-solid fa-broom text-xl"></i>
        </div>
        <div>
          <h1 class="font-extrabold text-sm text-slate-100 tracking-wide">Piket Rumah Ceria</h1>
          <div class="flex items-center space-x-1.5 mt-0.5">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
            <span class="text-[10px] text-emerald-400 font-semibold tracking-wider uppercase">Live Monitoring Pro</span>
          </div>
        </div>
      </div>
      
      <!-- Mode Switcher -->
      <div class="flex bg-slate-950 p-1 rounded-2xl border border-slate-800 text-xs font-semibold shadow-inner">
        <button id="btn-mode-anak" onclick="playSnd('click'); switchMode('anak')" class="px-3.5 py-1.5 rounded-xl bg-amber-500 text-slate-950 font-black shadow-md transition-all">Anak</button>
        <button id="btn-mode-ortu" onclick="playSnd('click'); openPinModal()" class="px-3.5 py-1.5 rounded-xl text-slate-400 hover:text-slate-200 transition-all flex items-center space-x-1">
          <i class="fa-solid fa-lock text-[10px]"></i>
          <span>Ortu</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-6">

    <!-- Progress Ring & Statistik Mingguan -->
    <section class="bg-gradient-to-br from-slate-900/90 via-slate-900/50 to-slate-950 border border-slate-800/80 p-4 rounded-3xl shadow-2xl relative overflow-hidden">
      <div class="flex items-center justify-between mb-3">
        <div>
          <h2 class="text-xs
