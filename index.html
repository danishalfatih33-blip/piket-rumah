<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi & Monitoring Piket Rumah</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 15px rgba(234, 179, 8, 0.6); }
      50% { box-shadow: 0 0 30px rgba(234, 179, 8, 0.9); }
    }
    .best-piket-card {
      animation: pulse-glow 2s infinite;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-12">

  <!-- Header Header & Switcher Mode -->
  <header class="bg-indigo-600 text-white shadow-lg sticky top-0 z-40">
    <div class="max-w-md mx-auto p-4 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <i class="fa-solid font-bold fa-broom text-yellow-300 text-xl"></i>
        <h1 class="font-bold text-lg">Piket Rumah Ceria</h1>
      </div>
      <div class="flex bg-indigo-800 p-1 rounded-lg text-xs font-semibold">
        <button id="btn-mode-anak" onclick="switchMode('anak')" class="px-3 py-1.5 rounded-md bg-white text-indigo-900 shadow">Anak</button>
        <button id="btn-mode-ortu" onclick="switchMode('ortu')" class="px-3 py-1.5 rounded-md text-indigo-200">Orang Tua</button>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-6">

    <!-- Fitur Baru: Piket Terbaik Bulan Ini -->
    <section class="bg-white rounded-2xl shadow-sm p-4 border border-slate-200 text-center relative overflow-hidden">
      <div class="flex items-center justify-center space-x-2 mb-3">
        <i class="fa-solid fa-trophy text-yellow-500 text-xl"></i>
        <h2 class="font-bold text-slate-800">Piket Terbaik Bulan Ini</h2>
      </div>

      <div id="winner-container" class="space-y-2">
        <!-- Akan diisi otomatis via JS -->
      </div>

      <!-- Tombol Pemicu Efek & Pengumuman Khusus Ortu -->
      <div id="ortu-winner-control" class="hidden mt-3 pt-3 border-t border-slate-100">
        <button onclick="celebrateWinner()" class="w-full py-2 bg-gradient-to-r from-yellow-400 to-amber-500 text-white font-bold rounded-xl shadow text-xs flex items-center justify-center space-x-2">
          <i class="fa-solid fa-wand-magic-sparkles"></i>
          <span>Rayakan & Kirim Efek Konfeti!</span>
        </button>
      </div>
    </section>

    <!-- Profile & Skor Bintang -->
    <section class="grid grid-cols-2 gap-4">
      <!-- Profile Alfatih -->
      <div id="card-alfatih" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 text-center relative">
        <div class="relative w-20 h-20 mx-auto mb-2">
          <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Alfatih" class="w-full h-full rounded-full bg-indigo-50 border-2 border-indigo-200 p-1">
          <!-- Banner Tambahan PP untuk Pemenang -->
          <div id="banner-alfatih" class="hidden absolute -bottom-2 left-1/2 -translate-x-1/2 bg-amber-400 text-slate-900 text-[10px] font-black px-2 py-0.5 rounded-full shadow border border-white whitespace-nowrap flex items-center space-x-1">
            <i class="fa-solid fa-crown text-xs"></i>
            <span>TERBAIK</span>
          </div>
        </div>
        <h3 class="font-bold text-slate-800 text-sm">Alfatih</h3>
        <div class="flex items-center justify-center space-x-1 mt-1 text-amber-500 font-bold text-sm">
          <i class="fa-solid fa-star"></i>
          <span id="score-alfatih">0</span> Bintang
        </div>
      </div>

      <!-- Profile Syifa -->
      <div id="card-syifa" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 text-center relative">
        <div class="relative w-20 h-20 mx-auto mb-2">
          <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Syifa" class="w-full h-full rounded-full bg-pink-50 border-2 border-pink-200 p-1">
          <!-- Banner Tambahan PP untuk Pemenang -->
          <div id="banner-syifa" class="hidden absolute -bottom-2 left-1/2 -translate-x-1/2 bg-amber-400 text-slate-900 text-[10px] font-black px-2 py-0.5 rounded-full shadow border border-white whitespace-nowrap flex items-center space-x-1">
            <i class="fa-solid fa-crown text-xs"></i>
            <span>TERBAIK</span>
          </div>
        </div>
        <h3 class="font-bold text-slate-800 text-sm">Syifa</h3>
        <div class="flex items-center justify-center space-x-1 mt-1 text-amber-500 font-bold text-sm">
          <i class="fa-solid fa-star"></i>
          <span id="score-syifa">0</span> Bintang
        </div>
      </div>
    </section>

    <!-- Form Absen Piket (Mode Anak) -->
    <section id="section-absen" class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
      <h2 class="font-bold text-slate-800 text-sm flex items-center space-x-2">
        <i class="fa-solid fa-clipboard-check text-indigo-600"></i>
        <span>Form Absen Piket Baru</span>
      </h2>

      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Siapa yang piket?</label>
          <select id="input-nama" class="w-full p-2.5 rounded-xl border border-slate-200 text-sm bg-slate-50 focus:ring-2 focus:ring-indigo-500 outline-none">
            <option value="Alfatih">Alfatih</option>
            <option value="Syifa">Syifa</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Jenis Piket Hari Ini</label>
          <select id="input-tugas" class="w-full p-2.5 rounded-xl border border-slate-200 text-sm bg-slate-50 focus:ring-2 focus:ring-indigo-500 outline-none">
            <option value="Nyapu & Ngepel (Hari Minggu)">Nyapu & Ngepel (Setiap Minggu)</option>
            <option value="Bersihin Kamar Mandi">Bersihin Kamar Mandi (Mingguan)</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Mulai Jam</label>
            <input type="time" id="input-mulai" class="w-full p-2.5 rounded-xl border border-slate-200 text-sm bg-slate-50 focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Kelar Jam</label>
            <input type="time" id="input-selesai" class="w-full p-2.5 rounded-xl border border-slate-200 text-sm bg-slate-50 focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Upload Foto Bukti Hasil Piket</label>
          <input type="file" id="input-foto" accept="image/*" class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-600 hover:file:bg-indigo-100">
        </div>

        <button onclick="simpanAbsen()" class="w-full py-3 bg-indigo-600 text-white font-bold rounded-xl shadow-md hover:bg-indigo-700 transition text-sm">
          Kirim Absen Piket
        </button>
      </div>
    </section>

    <!-- Riwayat & Verifikasi Ortu -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
      <h2 class="font-bold text-slate-800 text-sm flex items-center space-x-2">
        <i class="fa-solid fa-clock-rotate-left text-indigo-600"></i>
        <span>Riwayat Piket & Status</span>
      </h2>

      <div id="list-riwayat" class="space-y-3">
        <!-- List riwayat akan muncul di sini -->
      </div>
    </section>

  </main>

  <script>
    let currentMode = 'anak';
    let dataPiket = JSON.parse(localStorage.getItem('piket_data')) || [];
    let skorBintang = JSON.parse(localStorage.getItem('piket_skor')) || { Alfatih: 0, Syifa: 0 };

    function initData() {
      renderApp();
    }

    function switchMode(mode) {
      currentMode = mode;
      const btnAnak = document.getElementById('btn-mode-anak');
      const btnOrtu = document.getElementById('btn-mode-ortu');

      if (mode === 'anak') {
        btnAnak.className = 'px-3 py-1.5 rounded-md bg-white text-indigo-900 shadow';
        btnOrtu.className = 'px-3 py-1.5 rounded-md text-indigo-200';
        document.getElementById('section-absen').classList.remove('hidden');
        document.getElementById('ortu-winner-control').classList.add('hidden');
      } else {
        btnOrtu.className = 'px-3 py-1.5 rounded-md bg-white text-indigo-900 shadow';
        btnAnak.className = 'px-3 py-1.5 rounded-md text-indigo-200';
        document.getElementById('section-absen').classList.add('hidden');
        document.getElementById('ortu-winner-control').classList.remove('hidden');
      }
      renderApp();
    }

    function simpanAbsen() {
      const nama = document.getElementById('input-nama').value;
      const tugas = document.getElementById('input-tugas').value;
      const mulai = document.getElementById('input-mulai').value;
      const selesai = document.getElementById('input-selesai').value;
      const fotoInput = document.getElementById('input-foto');

      if (!mulai || !selesai) {
        alert('Tolong isi jam mulai dan jam kelar piketnya ya!');
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        const itemPiket = {
          id: Date.now(),
          nama: nama,
          tugas: tugas,
          mulai: mulai,
          selesai: selesai,
          foto: e.target.result || 'https://via.placeholder.com/150',
          status: 'Menunggu Verifikasi',
          tanggal: new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'short' })
        };

        dataPiket.unshift(itemPiket);
        localStorage.setItem('piket_data', JSON.stringify(dataPiket));
        renderApp();
        alert('Absen piket berhasil dikirim!');
      };

      if (fotoInput.files[0]) {
        reader.readAsDataURL(fotoInput.files[0]);
      } else {
        reader.onload({ target: { result: 'https://via.placeholder.com/150?text=Tanpa+Foto' } });
      }
    }

    function verifikasi(id, disetujui) {
      dataPiket = dataPiket.map(item => {
        if (item.id === id) {
          if (disetujui && item.status !== 'Disetujui (+1 Star)') {
            skorBintang[item.nama] += 1;
            item.status = 'Disetujui (+1 Star)';
          } else if (!disetujui) {
            item.status = 'Perlu Diulang';
          }
        }
        return item;
      });

      localStorage.setItem('piket_data', JSON.stringify(dataPiket));
      localStorage.setItem('piket_skor', JSON.stringify(skorBintang));
      renderApp();
    }

    function celebrateWinner() {
      confetti({
        particleCount: 120,
        spread: 80,
        origin: { y: 0.6 }
      });
    }

    function renderApp() {
      // Render Skor Bintang
      document.getElementById('score-alfatih').innerText = skorBintang.Alfatih;
      document.getElementById('score-syifa').innerText = skorBintang.Syifa;

      // Hitung Pemenang / Piket Terbaik
      const bannerAlfatih = document.getElementById('banner-alfatih');
      const bannerSyifa = document.getElementById('banner-syifa');
      const cardAlfatih = document.getElementById('card-alfatih');
      const cardSyifa = document.getElementById('card-syifa');
      const winnerContainer = document.getElementById('winner-container');

      bannerAlfatih.classList.add('hidden');
      bannerSyifa.classList.add('hidden');
      cardAlfatih.classList.remove('best-piket-card', 'border-yellow-400');
      cardSyifa.classList.remove('best-piket-card', 'border-yellow-400');

      if (skorBintang.Alfatih === 0 && skorBintang.Syifa === 0) {
        winnerContainer.innerHTML = `<p class="text-xs text-slate-500 italic">Belum ada nilai piket bulan ini. Ayo mulai absen piket!</p>`;
      } else if (skorBintang.Alfatih === skorBintang.Syifa) {
        winnerContainer.innerHTML = `
          <div class="bg-amber-50 border border-amber-200 rounded-xl p-2 text-xs text-amber-800 font-semibold">
            🤝 Seri! Alfatih & Syifa sama-sama dapat ${skorBintang.Alfatih} Bintang!
          </div>`;
        bannerAlfatih.classList.remove('hidden');
        bannerSyifa.classList.remove('hidden');
      } else {
        const winner = skorBintang.Alfatih > skorBintang.Syifa ? 'Alfatih' : 'Syifa';
        const topScore = Math.max(skorBintang.Alfatih, skorBintang.Syifa);

        if (winner === 'Alfatih') {
          bannerAlfatih.classList.remove('hidden');
          cardAlfatih.classList.add('best-piket-card', 'border-yellow-400');
        } else {
          bannerSyifa.classList.remove('hidden');
          cardSyifa.classList.add('best-piket-card', 'border-yellow-400');
        }

        winnerContainer.innerHTML = `
          <div class="bg-amber-50 border border-amber-200 rounded-xl p-3">
            <p class="text-xs text-amber-800">Selamat kepada <span class="font-bold text-amber-900">${winner}</span> atas rajin piket bulan ini!</p>
            <p class="text-sm font-black text-amber-600 mt-0.5">🏆 Total ${topScore} Bintang</p>
          </div>`;
      }

      // Render Riwayat
      const listContainer = document.getElementById('list-riwayat');
      listContainer.innerHTML = '';

      if (dataPiket.length === 0) {
        listContainer.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">Belum ada riwayat piket.</p>';
        return;
      }

      dataPiket.forEach(item => {
        let badgeColor = 'bg-yellow-100 text-yellow-700';
        if (item.status.includes('Disetujui')) badgeColor = 'bg-emerald-100 text-emerald-700';
        if (item.status === 'Perlu Diulang') badgeColor = 'bg-rose-100 text-rose-700';

        const card = document.createElement('div');
        card.className = 'border border-slate-100 bg-slate-50 rounded-xl p-3 space-y-2';
        card.innerHTML = `
          <div class="flex items-start justify-between">
            <div>
              <span class="font-bold text-slate-800 text-xs">${item.nama}</span>
              <p class="text-[11px] text-slate-500">${item.tugas}</p>
              <p class="text-[10px] text-slate-400 mt-0.5">${item.tanggal} • ${item.mulai} - ${item.selesai}</p>
            </div>
            <span class="text-[10px] px-2 py-0.5 rounded-full font-bold ${badgeColor}">${item.status}</span>
          </div>

          ${item.foto ? `<img src="${item.foto}" class="w-full h-32 object-cover rounded-lg border border-slate-200">` : ''}

          ${currentMode === 'ortu' && item.status === 'Menunggu Verifikasi' ? `
            <div class="flex space-x-2 pt-1">
              <button onclick="verifikasi(${item.id}, true)" class="flex-1 py-1.5 bg-emerald-600 text-white font-bold rounded-lg text-xs shadow">Setujui (+1 ⭐)</button>
              <button onclick="verifikasi(${item.id}, false)" class="flex-1 py-1.5 bg-rose-500 text-white font-bold rounded-lg text-xs shadow">Minta Ulang</button>
            </div>
          ` : ''}
        `;
        listContainer.appendChild(card);
      });
    }

    initData();
  </script>
</body>
</html>
